<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

    <div class="flex justify-center items-center h-screen">
        <div class="w-full max-w-2xl bg-white p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold text-center mb-6">Create an Account</h2>

            {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                <div
                    class="p-3 text-white {% if message.tags == 'success' %}bg-green-500{% else %}bg-red-500{% endif %} rounded-lg">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="username" class="block text-sm font-semibold">Username</label>
                    <input type="text" name="username" id="username" class="w-full px-4 py-2 mt-2 border rounded-md"
                        required>
                </div>
                <div class="grid md:flex w-full md:gap-2">

                    <div class="mb-4 w-full">
                        <label for="first_name" class="block text-sm font-semibold">First Name</label>
                        <input type="text" name="first_name" id="first_name" class="w-full px-4 py-2 mt-2 border rounded-md"
                            required>
                    </div>

                    <div class="mb-4 w-full">
                        <label for="last_name" class="block text-sm font-semibold">Last name</label>
                        <input type="text" name="last_name" id="last_name" class="w-full px-4 py-2 mt-2 border rounded-md">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="email" class="block text-sm font-semibold">Email</label>
                    <input type="email" name="email" id="email" class="w-full px-4 py-2 mt-2 border rounded-md"
                        required>
                </div>

                <div class="mb-4">
                    <label for="password1" class="block text-sm font-semibold">Password</label>
                    <input type="password" name="password1" id="password1"
                        class="w-full px-4 py-2 mt-2 border rounded-md" required>
                </div>

                <div class="mb-4">
                    <label for="password2" class="block text-sm font-semibold">Confirm Password</label>
                    <input type="password" name="password2" id="password2"
                        class="w-full px-4 py-2 mt-2 border rounded-md" required>
                </div>

                <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md">Register</button>
            </form>

            <div class="text-center mt-4">
                <p class="text-sm text-gray-600">Already have an account? <a href="{% url 'login' %}"
                        class="text-blue-500">Login</a></p>
            </div>
        </div>
    </div>

</body>

</html>
